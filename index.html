<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Team Scheduler</title>
<style>
  :root {
    --bg: #f3ede6;
    --surface: #ffffff;
    --surface2: #eae4db;
    --text: #141210;
    --text-dim: #6e655c;
    --accent: #b5422a;
    --accent-hover: #963522;
    --green: #1a5c3a;
    --green-bg: #b8e0b2;
    --green-text: #0d3a1e;
    --yellow: #7d6218;
    --yellow-bg: #f0e0a0;
    --yellow-text: #4a3a0e;
    --orange: #a8500e;
    --orange-bg: #f5d4a8;
    --orange-text: #6e3408;
    --red: #8e3518;
    --red-bg: #f0cfc4;
    --red-text: #5a2210;
    --border: #d4ccc2;
    --border-strong: #b5ada4;
    --lunch-bg: #ddd9d2;
    /* Match tiers — only for 2+ people */
    --t1: #a0d89a; --t1-text: #0d3a1e;   /* green: 2+ available */
    --t2: #e0d4b0; --t2-text: #5a4a28;   /* tan: 1 avail + 1+ maybe */
    --t3: #b8d4e8; --t3-text: #1e3a50;   /* soft blue: 2+ maybe, no avail */
    --t1-dot: #2a8a3e;
    --t2-dot: #a08840;
    --t3-dot: #3a7aa0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
  }

  #login-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  #login-screen h1 { font-size: 2em; margin-bottom: 8px; }
  #login-screen p { color: var(--text-dim); margin-bottom: 24px; }
  #login-screen input {
    padding: 12px 16px; font-size: 1.1em; border: 2px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); width: 280px; margin-bottom: 12px; outline: none;
  }
  #login-screen input:focus { border-color: var(--accent); }
  #login-screen .join-btn {
    padding: 12px 32px; font-size: 1.1em; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer; font-weight: 600;
  }
  #login-screen .join-btn:hover { background: var(--accent-hover); }
  .existing-users { margin-top: 24px; text-align: center; }
  .existing-users p { font-size: 0.9em; margin-bottom: 8px; color: var(--text-dim); }
  .user-chip {
    display: inline-block; padding: 6px 14px; margin: 4px; border-radius: 20px;
    background: var(--surface); cursor: pointer; font-size: 0.9em;
    border: 1px solid var(--border); color: var(--text);
  }
  .user-chip:hover { border-color: var(--accent); background: var(--surface2); }

  #app-screen { display: none; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 4px 8px;
  }
  header h2 { font-size: 1.1em; white-space: nowrap; }
  #header-controls {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0;
    justify-content: flex-start; padding: 0 8px;
  }
  #header-controls .paint-btn {
    padding: 4px 10px; font-size: 0.78em;
  }
  #header-controls .paint-label {
    font-size: 0.75em; margin-right: 2px;
  }
  #header-controls .info-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border);
    font-size: 0.6em; color: var(--text-dim); cursor: help; margin-left: -2px;
    font-style: italic; font-family: Georgia, serif;
  }
  #header-controls .ro-label {
    font-size: 0.78em; color: var(--text-dim); font-style: italic;
  }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.live { background: var(--green); }
  .status-dot.offline { background: var(--red); }
  .header-right { display: flex; align-items: center; gap: 8px; font-size: 0.85em; flex-wrap: wrap; }
  .btn-small {
    padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); color: var(--text-dim); cursor: pointer; font-size: 0.85em;
  }
  .btn-small:hover { border-color: var(--accent); color: var(--accent); }
  .btn-small.admin-active { border-color: var(--orange); color: var(--orange); }

  .admin-bar {
    padding: 6px 16px; background: rgba(184,92,26,0.06); border-bottom: 1px solid rgba(184,92,26,0.15);
    font-size: 0.82em; color: var(--orange); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .admin-bar .del-btn {
    padding: 3px 10px; border: 1px solid rgba(184,92,26,0.3); border-radius: 5px;
    background: transparent; color: var(--orange); cursor: pointer; font-size: 0.85em; font-family: inherit;
  }
  .admin-bar .del-btn:hover { background: rgba(184,92,26,0.1); }

  .tabs {
    display: flex; gap: 0; padding: 0 8px; background: var(--surface);
    border-bottom: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 10px 16px; cursor: pointer; font-size: 0.9em; white-space: nowrap;
    border-bottom: 2px solid transparent; color: var(--text-dim);
    background: none; border-top: none; border-left: none; border-right: none; font-family: inherit;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab.you-tab { color: var(--green); font-weight: 700; background: rgba(26,92,58,0.06); border-bottom-color: var(--green); }
  .tab.you-tab.active { color: var(--green); border-bottom-color: var(--green); }
  .tab.delete-tab { color: var(--red); }
  .tab.delete-tab:hover { color: var(--red); background: rgba(142,53,24,0.06); }

  .paint-btn {
    padding: 6px 14px; border: 2px solid var(--border); border-radius: 6px;
    cursor: pointer; font-size: 0.85em; font-weight: 600; background: var(--surface2); color: var(--text-dim);
    font-family: inherit; transition: all 0.1s;
  }
  .paint-btn.active { border-color: var(--text); }
  .paint-btn[data-status="A"] { background: var(--green-bg); color: var(--green-text); }
  .paint-btn[data-status="A"].active { border-color: var(--green); }
  .paint-btn[data-status="M"] { background: var(--yellow-bg); color: var(--yellow-text); }
  .paint-btn[data-status="M"].active { border-color: var(--yellow); }
  .paint-btn[data-status="B"] { background: var(--red-bg); color: var(--red-text); }
  .paint-btn[data-status="B"].active { border-color: var(--red); }
  .paint-btn[data-status="clear"] { background: var(--surface); color: var(--text-dim); }
  .paint-btn[data-status="clear"].active { border-color: var(--text-dim); }
  .paint-btn[data-status="cycle"] { background: var(--surface2); color: var(--text); }
  .paint-btn[data-status="cycle"].active { border-color: var(--accent); color: var(--accent); }

  .grid-container { overflow-x: auto; padding: 8px; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; min-width: 700px; user-select: none; -webkit-user-select: none; }
  th, td { border: 1px solid var(--border); text-align: center; font-size: 0.8em; }
  th { background: var(--surface2); padding: 8px 4px; position: sticky; top: 0; z-index: 10; font-weight: 600; color: var(--text); }
  .time-col {
    position: sticky; left: 0; z-index: 5; background: var(--surface); padding: 4px 8px;
    white-space: nowrap; font-weight: 500; min-width: 70px; color: var(--text-dim);
  }
  .time-col.lunch-hour { background: var(--lunch-bg); }

  td.cell {
    padding: 6px 2px; cursor: pointer; min-width: 72px; height: 32px; transition: background 0.1s;
    background: var(--surface);
  }
  td.cell:hover { filter: brightness(0.96); }
  td.cell[data-val="A"] { background: var(--green-bg); color: var(--green-text); font-weight: 600; }
  td.cell[data-val="M"] { background: var(--yellow-bg); color: var(--yellow-text); font-weight: 600; }
  td.cell[data-val="B"] { background: var(--red-bg); color: var(--red-text); font-weight: 600; }
  td.cell.lunch-hour { border-top: 1.5px solid var(--border-strong); border-bottom: 1.5px solid var(--border-strong); }
  td.cell.lunch-hour:not([data-val="A"]):not([data-val="M"]):not([data-val="B"]) { background: var(--lunch-bg); }

  /* Overview cells */
  td.overview-cell { padding: 3px 2px; min-width: 90px; vertical-align: top; background: var(--surface); }
  td.overview-cell.clickable { cursor: pointer; }
  td.overview-cell.clickable:hover { filter: brightness(0.94); }
  .ov-edit-toggle {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; margin-left: 8px;
    border: 1.5px solid var(--border); border-radius: 5px; cursor: pointer;
    font-size: 0.7em; font-weight: 600; color: var(--text-dim); background: var(--surface2);
    vertical-align: middle; transition: all 0.15s; letter-spacing: 0.01em;
  }
  .ov-edit-toggle:hover { border-color: var(--green); color: var(--green); }
  .ov-edit-toggle.active {
    border-color: var(--green); color: #fff; background: var(--green);
    box-shadow: 0 1px 3px rgba(26,92,58,0.25);
  }
  td.overview-cell.lunch-hour { border-top: 1.5px solid var(--border-strong); border-bottom: 1.5px solid var(--border-strong); }
  td.overview-cell.lunch-hour:not([data-lvl]) { background: var(--lunch-bg); }
  .ov-tags { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; }
  .ov-tag { font-size: 0.72em; padding: 1px 6px; border-radius: 3px; white-space: nowrap; font-weight: 600; }
  .ov-tag.avail { background: var(--green-bg); color: var(--green-text); }
  .ov-tag.maybe { background: var(--yellow-bg); color: var(--yellow-text); }

  /* Match tier highlighting */
  td.overview-cell[data-lvl="1"] { background: var(--t1); }
  td.overview-cell[data-lvl="2"] { background: var(--t2); }
  td.overview-cell[data-lvl="3"] { background: var(--t3); }

  /* Summary rows */
  tr.summary-spacer td { height: 10px; border: none; background: transparent; }
  tr.summary-header td {
    background: var(--surface2); font-weight: 700; font-size: 0.75em; color: var(--text-dim);
    padding: 5px 4px; border-color: var(--border-strong); text-transform: uppercase; letter-spacing: 0.04em;
  }
  td.summary-cell {
    background: var(--surface); padding: 5px 4px; vertical-align: top;
    font-size: 0.72em; line-height: 1.6; border-color: var(--border); text-align: left;
  }
  .best-slot { display: flex; align-items: baseline; gap: 4px; padding: 2px 0; }
  .best-slot .tier-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
  .best-slot .tier-dot.t1 { background: var(--t1-dot); }
  .best-slot .tier-dot.t2 { background: var(--t2-dot); }
  .best-slot .tier-dot.t3 { background: var(--t3-dot); }
  .best-slot .sr { font-weight: 700; color: var(--text); }
  .best-slot .sdur { font-weight: 500; color: var(--text-dim); font-size: 0.9em; }
  .best-slot .sp { color: var(--text-dim); font-size: 0.9em; }
  .best-slot .hot-tag { color: var(--orange); font-style: italic; font-size: 0.88em; }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: flex;
    align-items: center; justify-content: center; z-index: 500;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  .modal h3 { margin-bottom: 12px; }
  .modal input, .modal select {
    width: 100%; padding: 10px 12px; border: 2px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 1em; margin-bottom: 12px; outline: none; font-family: inherit;
  }
  .modal input:focus, .modal select:focus { border-color: var(--accent); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-btns button {
    padding: 8px 18px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface2); color: var(--text); cursor: pointer; font-family: inherit;
  }
  .modal-btns button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-btns button.danger { background: var(--red); color: #fff; border-color: var(--red); }
  .modal-btns button:hover { opacity: 0.9; }
  .modal .error-msg { color: var(--red); font-size: 0.85em; margin-bottom: 8px; }
  .modal .info-msg { color: var(--text-dim); font-size: 0.82em; margin-bottom: 10px; line-height: 1.4; }
  .modal .del-list { margin: 10px 0; }
  .modal .del-list button {
    display: block; width: 100%; text-align: left; padding: 10px 14px; margin-bottom: 4px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
    color: var(--text); cursor: pointer; font-family: inherit; font-size: 0.95em;
  }
  .modal .del-list button:hover { border-color: var(--red); color: var(--red); background: rgba(142,53,24,0.04); }

  .add-panel { padding: 24px; text-align: center; }
  .add-panel input {
    padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font-size: 1em; width: 220px; margin-right: 8px; outline: none;
  }
  .add-panel input:focus { border-color: var(--accent); }
  .add-panel button {
    padding: 10px 20px; border: none; border-radius: 8px; background: var(--accent);
    color: #fff; cursor: pointer; font-weight: 600;
  }

  @media (max-width: 600px) {
    header { flex-wrap: nowrap; padding: 8px 10px; }
    header h2 { font-size: 0.9em; }
    .header-right { gap: 4px; font-size: 0.78em; }
    .header-right .btn-small { padding: 3px 8px; font-size: 0.78em; }
    #header-controls {
      order: 10; flex-basis: 100%; padding: 6px 0 2px;
      justify-content: flex-start; gap: 3px;
      border-top: 1px solid var(--border); margin-top: 4px;
    }
    #header-controls:empty { display: none; }
    #header-controls .paint-btn { padding: 4px 8px; font-size: 0.72em; }
    #header-controls .paint-label { font-size: 0.7em; }
    #header-controls .info-icon { width: 12px; height: 12px; font-size: 0.55em; }
    .ov-edit-toggle { font-size: 0.68em; padding: 3px 8px; }
    th, td { font-size: 0.7em; }
    td.cell { min-width: 56px; height: 34px; }
    .tabs { padding: 0 4px; }
    .tab { padding: 8px 10px; font-size: 0.82em; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Team Scheduler</h1>
  <p>Pick your name or type a new one</p>
  <input type="text" id="name-input" placeholder="Your name..." autocomplete="off" onkeydown="if(event.key==='Enter')joinAs()">
  <button class="join-btn" onclick="joinAs()">Join</button>
  <div class="existing-users" id="existing-users"></div>
</div>

<div id="app-screen">
  <header>
    <h2>Team Scheduler</h2>
    <div id="header-controls"></div>
    <div class="header-right">
      <span style="font-size:0.7em;color:var(--text-dim);opacity:0.5;">v2.2</span>
      <span><span class="status-dot" id="status-dot"></span><span id="status-text">Connecting...</span></span>
      <button class="btn-small" id="admin-toggle-btn" onclick="toggleAdmin()">Admin</button>
      <button class="btn-small" onclick="logout()">Switch User</button>
    </div>
  </header>
  <div id="admin-bar-container"></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid-container" id="grid-container"></div>
</div>

<div id="modal-container"></div>

<script>
const SUPABASE_URL = 'https://nxjypjgqsywxukcnchmh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54anlwamdxc3l3eHVrY25jaG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMTAzNzQsImV4cCI6MjA4OTY4NjM3NH0.Hh1GErLUxJbswFJGi8xVEzD60AUkRX0JVPgo91pdVKY';

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function buildDays() {
  const days = [], d = new Date();
  for (let i = 0; i < 10; i++) { days.push(`${DAY_NAMES[d.getDay()]} ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`); d.setDate(d.getDate()+1); }
  return days;
}
const DAYS = buildDays();
const TIMES = [];
for (let h = 7; h < 18; h++) for (let m = 0; m < 60; m += 30) { const hr=h>12?h-12:h; TIMES.push(`${hr}:${m===0?'00':'30'} ${h>=12?'PM':'AM'}`); }

function isLunchTime(t) { return t.startsWith('11:00') || t.startsWith('11:30'); }
function isHotTime(t) { return ['1:00 PM','1:30 PM','2:00 PM','2:30 PM'].includes(t); }

const CYCLE = ['A','M','B',''];
const STATUS_SHORT = { A:'✓', M:'~', B:'✗' };

let currentUser=null, allData={}, paintStatus='A', isPainting=false, activeTab='overview', isOnline=false, isAdmin=false, admins={}, dragPaintVal=null;

// ===== SUPABASE =====
async function sbFetch(path, opts={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts, headers: { 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json', 'Prefer':opts.prefer||'', ...opts.headers }
  });
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  if (res.status===204) return null;
  return (res.headers.get('content-type')||'').includes('json') ? res.json() : null;
}
async function loadAllSchedules() {
  try { const rows=await sbFetch('schedules?select=*'); allData={}; (rows||[]).forEach(r=>{allData[r.name]=typeof r.data==='string'?JSON.parse(r.data):r.data;}); setOnline(true); }
  catch(e) { console.error('Load:',e); setOnline(false); }
}
async function saveSchedule(name, data) {
  try { await sbFetch('schedules',{method:'POST',prefer:'resolution=merge-duplicates',body:JSON.stringify({id:name.toLowerCase().replace(/[^a-z0-9]/g,'-'),name,data,updated_at:new Date().toISOString()})}); setOnline(true); }
  catch(e) { console.error('Save:',e); setOnline(false); }
}
async function deleteSchedule(name) {
  try { await sbFetch(`schedules?id=eq.${encodeURIComponent(name.toLowerCase().replace(/[^a-z0-9]/g,'-'))}`,{method:'DELETE'}); delete allData[name]; } catch(e) { console.error('Del:',e); }
}

// ===== ADMIN =====
async function loadAdmins() {
  try { const rows=await sbFetch('schedules?id=eq.__admins__&select=*'); if(rows&&rows.length>0) admins=typeof rows[0].data==='string'?JSON.parse(rows[0].data):rows[0].data; else { admins={Art:hashPw('amitofo108')}; await saveAdmins(); } }
  catch(e) { admins={Art:hashPw('amitofo108')}; }
}
async function saveAdmins() {
  try { await sbFetch('schedules',{method:'POST',prefer:'resolution=merge-duplicates',body:JSON.stringify({id:'__admins__',name:'__admins__',data:admins,updated_at:new Date().toISOString()})}); } catch(e) {}
}
function hashPw(pw) { let h=0; for(let i=0;i<pw.length;i++) h=((h<<5)-h+pw.charCodeAt(i))|0; return 'h'+Math.abs(h).toString(36); }

function toggleAdmin() {
  if(isAdmin){isAdmin=false;updateAdminUI();return;}
  showModal(`<h3>Admin Login</h3><p class="info-msg">Enter your admin password.</p>
    <input type="password" id="admin-pw" placeholder="Password..." onkeydown="if(event.key==='Enter')confirmAdmin()">
    <div id="admin-error"></div>
    <div class="modal-btns"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmAdmin()">Login</button></div>`);
  setTimeout(()=>{const e=document.getElementById('admin-pw');if(e)e.focus();},100);
}
function confirmAdmin() {
  const pw=document.getElementById('admin-pw').value; if(!pw) return;
  if(admins[currentUser]===hashPw(pw)){isAdmin=true;closeModal();updateAdminUI();}
  else document.getElementById('admin-error').innerHTML='<p class="error-msg">Wrong password.</p>';
}
function updateAdminUI() {
  const b=document.getElementById('admin-toggle-btn'); if(b) b.className=isAdmin?'btn-small admin-active':'btn-small';
  renderAdminBar(); buildTabs();
}
function renderAdminBar() {
  const c=document.getElementById('admin-bar-container');
  if(!isAdmin){c.innerHTML='';return;}
  let html='<div class="admin-bar"><span>Admin mode</span>';
  html+=`<button class="del-btn" onclick="showPromoteAdmin()">+ Make Admin</button>`;
  html+=`<button class="del-btn" onclick="showChangePassword()">Change Password</button></div>`;
  c.innerHTML=html;
}

function showDeleteModal() {
  const names=Object.keys(allData).filter(n=>n!=='__admins__');
  showModal(`<h3>Delete a User</h3><p class="info-msg">This permanently removes their schedule data.</p>
    <div class="del-list">${names.map(n=>`<button onclick="confirmDeleteUser('${esc(n)}')">${esc(n)}</button>`).join('')}</div>
    <div class="modal-btns"><button onclick="closeModal()">Cancel</button></div>`);
}
function confirmDeleteUser(name) {
  if(!confirm(`Delete ${name} and all their data?`)) return;
  deleteSchedule(name);
  if(admins[name]){delete admins[name];saveAdmins();}
  closeModal(); buildTabs(); switchTab('overview');
}

function showPromoteAdmin() {
  const names=Object.keys(allData).filter(n=>n!=='__admins__'&&!admins[n]);
  if(!names.length){alert('All users are already admins.');return;}
  showModal(`<h3>Make Someone Admin</h3><p class="info-msg">Pick a user and set their admin password.</p>
    <select id="promote-select">${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select>
    <input type="password" id="promote-pw" placeholder="Set their password...">
    <div id="promote-error"></div>
    <div class="modal-btns"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmPromote()">Make Admin</button></div>`);
}
function confirmPromote() {
  const name=document.getElementById('promote-select').value,pw=document.getElementById('promote-pw').value;
  if(!pw||pw.length<3){document.getElementById('promote-error').innerHTML='<p class="error-msg">Min 3 characters.</p>';return;}
  admins[name]=hashPw(pw);saveAdmins();closeModal();renderAdminBar();alert(`${name} is now an admin.`);
}
function showChangePassword() {
  showModal(`<h3>Change Your Admin Password</h3>
    <input type="password" id="new-pw" placeholder="New password..." onkeydown="if(event.key==='Enter')document.getElementById('new-pw2').focus()">
    <input type="password" id="new-pw2" placeholder="Confirm..." onkeydown="if(event.key==='Enter')confirmChangePw()">
    <div id="pw-error"></div>
    <div class="modal-btns"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="confirmChangePw()">Change</button></div>`);
  setTimeout(()=>{const e=document.getElementById('new-pw');if(e)e.focus();},100);
}
function confirmChangePw() {
  const p1=document.getElementById('new-pw').value,p2=document.getElementById('new-pw2').value;
  if(!p1||p1.length<3){document.getElementById('pw-error').innerHTML='<p class="error-msg">Min 3 characters.</p>';return;}
  if(p1!==p2){document.getElementById('pw-error').innerHTML='<p class="error-msg">Passwords don\'t match.</p>';return;}
  admins[currentUser]=hashPw(p1);saveAdmins();closeModal();alert('Password changed.');
}

function showModal(h){document.getElementById('modal-container').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${h}</div></div>`;}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

function setOnline(o){isOnline=o;const d=document.getElementById('status-dot'),t=document.getElementById('status-text');if(d)d.className='status-dot '+(o?'live':'offline');if(t)t.textContent=o?'Live':'Offline';}

let pollTimer=null;
function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(async()=>{if(ovDirty)return;await loadAllSchedules();if(activeTab==='overview')renderOverview();},5000);}

// ===== LOGIN =====
async function initLogin(){
  await loadAllSchedules(); await loadAdmins();
  const names=Object.keys(allData).filter(n=>n!=='__admins__');
  const c=document.getElementById('existing-users');
  if(names.length>0) c.innerHTML='<p>Or pick an existing name:</p>'+names.map(n=>`<span class="user-chip" onclick="pickUser('${esc(n)}')">${esc(n)}</span>`).join('');
  const saved=localStorage.getItem('scheduler-user');
  if(saved&&allData[saved])enterApp(saved);
}
function pickUser(n){document.getElementById('name-input').value=n;joinAs();}
function joinAs(){
  const input=document.getElementById('name-input'),name=input.value.trim();
  if(!name){input.focus();return;}
  const existing=Object.keys(allData).find(n=>n.toLowerCase()===name.toLowerCase()&&n!=='__admins__');
  if(existing&&existing!==name){enterApp(existing);return;}
  if(!allData[name])allData[name]={};
  enterApp(name);
}
function enterApp(name){
  currentUser=name;localStorage.setItem('scheduler-user',name);
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
  isAdmin=false;updateAdminUI();buildTabs();switchTab(name);startPolling();
}
function logout(){
  localStorage.removeItem('scheduler-user');currentUser=null;isAdmin=false;
  if(pollTimer)clearInterval(pollTimer);
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('admin-bar-container').innerHTML='';
  initLogin();
}

// ===== TABS =====
function buildTabs(){
  const tabs=document.getElementById('tabs');
  const names=Object.keys(allData).filter(n=>n!=='__admins__');
  let html=`<button class="tab" data-tab="overview" onclick="switchTab('overview')">Overview</button>`;
  if(currentUser&&names.includes(currentUser))
    html+=`<button class="tab you-tab" data-tab="${esc(currentUser)}" onclick="switchTab('${esc(currentUser)}')">${esc(currentUser)} ★</button>`;
  names.filter(n=>n!==currentUser).sort().forEach(n=>{
    html+=`<button class="tab" data-tab="${esc(n)}" onclick="switchTab('${esc(n)}')">${esc(n)}</button>`;
  });
  html+=`<button class="tab" data-tab="add" onclick="switchTab('add')">+ Add</button>`;
  if(isAdmin) html+=`<button class="tab delete-tab" onclick="showDeleteModal()">− Delete</button>`;
  html+=`</div>`;
  tabs.innerHTML=html;
}

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  const hc=document.getElementById('header-controls'),grid=document.getElementById('grid-container');
  hc.innerHTML='';
  if(tab==='overview'){
    renderOverview();
  }
  else if(tab==='add'){
    grid.innerHTML=`<div class="add-panel"><h3 style="margin-bottom:16px;">Add Team Member</h3>
      <input type="text" id="new-member-name" placeholder="Name..." onkeydown="if(event.key==='Enter')addMember()">
      <button onclick="addMember()">Add</button></div>`;
  } else {
    const isMe=tab===currentUser;
    const canEdit=isMe||(currentUser==='Art'&&isAdmin);
    if(canEdit){
      const note=!isMe?' <span style="color:var(--orange);font-size:0.72em;">(admin)</span>':'';
      hc.innerHTML=`<span class="paint-label">Status:${note}</span>
        <button class="paint-btn ${paintStatus==='cycle'?'active':''}" data-status="cycle" onclick="setPaint('cycle',this)" title="Click to cycle through Available → Maybe → Busy → Clear">↖ Toggle Status<span class="info-icon" title="Click to cycle through Available → Maybe → Busy → Clear">i</span></button>
        <button class="paint-btn ${paintStatus==='A'?'active':''}" data-status="A" onclick="setPaint('A',this)">✓ Available</button>
        <button class="paint-btn ${paintStatus==='M'?'active':''}" data-status="M" onclick="setPaint('M',this)">~ Maybe</button>
        <button class="paint-btn ${paintStatus==='B'?'active':''}" data-status="B" onclick="setPaint('B',this)">✗ Busy</button>
        <button class="paint-btn ${paintStatus==='clear'?'active':''}" data-status="clear" onclick="setPaint('clear',this)">Eraser</button>`;
    } else {
      hc.innerHTML=`<span class="ro-label">Viewing ${esc(tab)}'s schedule</span>`;
    }
    renderEditGrid(tab,canEdit);
  }
}

// ===== PAINT =====
function setPaint(s,btn){paintStatus=s;document.querySelectorAll('.paint-btn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');}

let lastPaintedKey=null;
let touchStartPos=null;
let touchDidPaint=false;
const TOUCH_THRESHOLD=8; // px movement before it's considered a scroll

function getEditTarget(){if(currentUser==='Art'&&isAdmin&&activeTab!=='overview'&&activeTab!=='add')return activeTab;return currentUser;}
function canEditGrid(){if(!currentUser)return false;if(activeTab===currentUser)return true;if(currentUser==='Art'&&isAdmin)return true;return false;}

function startPaint(day,time,e){
  if(!canEditGrid())return;
  // Prevent mouse events from firing after touch
  if(e&&e.type==='mousedown'&&touchDidPaint){touchDidPaint=false;return;}
  isPainting=true;
  const target=getEditTarget(),data=allData[target]||{},key=`${day}|${time}`,cur=data[key]||'';
  lastPaintedKey=key;
  if(paintStatus==='cycle'){const i=CYCLE.indexOf(cur);dragPaintVal=CYCLE[(i+1)%CYCLE.length];}
  else if(paintStatus==='clear') dragPaintVal='';
  else dragPaintVal=paintStatus;
  if(dragPaintVal)data[key]=dragPaintVal;else delete data[key];
  allData[target]=data;updateCell(key,data[key]);
}
function continuePaint(day,time){
  if(!isPainting||!canEditGrid())return;
  const key=`${day}|${time}`;if(key===lastPaintedKey)return;lastPaintedKey=key;
  const target=getEditTarget(),data=allData[target]||{};
  let val;
  if(paintStatus==='cycle')val=dragPaintVal;else if(paintStatus==='clear')val='';else val=paintStatus;
  if(val)data[key]=val;else delete data[key];
  allData[target]=data;updateCell(key,data[key]);
}
function updateCell(key,val){const c=document.querySelector(`td[data-key="${CSS.escape(key)}"]`);if(c){c.setAttribute('data-val',val||'');c.textContent=STATUS_SHORT[val]||'';}}

// Touch handlers with scroll detection
function handleTouchStart(e, day, time) {
  const touch = e.touches[0];
  touchStartPos = { x: touch.clientX, y: touch.clientY };
  touchDidPaint = false;
  // Don't paint yet — wait to see if it's a scroll
  isPainting = false;
}

function handleTouchEnd(e, day, time) {
  if (!touchStartPos) return;
  const touch = e.changedTouches[0];
  const dx = Math.abs(touch.clientX - touchStartPos.x);
  const dy = Math.abs(touch.clientY - touchStartPos.y);
  // Only paint if finger didn't move much (tap, not scroll)
  if (dx < TOUCH_THRESHOLD && dy < TOUCH_THRESHOLD) {
    touchDidPaint = true;
    // Simulate a single paint action
    if (!canEditGrid()) return;
    const target = getEditTarget(), data = allData[target] || {};
    const key = `${day}|${time}`, cur = data[key] || '';
    let newVal;
    if (paintStatus === 'cycle') { const i = CYCLE.indexOf(cur); newVal = CYCLE[(i+1)%CYCLE.length]; }
    else if (paintStatus === 'clear') newVal = '';
    else newVal = paintStatus;
    if (newVal) data[key] = newVal; else delete data[key];
    allData[target] = data;
    updateCell(key, data[key]);
    debounceSave();
  }
  touchStartPos = null;
  isPainting = false;
  lastPaintedKey = null;
}

function handleTouchMove(e){
  // If finger moves beyond threshold, it's a scroll — don't paint
  if (!touchStartPos) return;
  const touch = e.touches[0];
  const dx = Math.abs(touch.clientX - touchStartPos.x);
  const dy = Math.abs(touch.clientY - touchStartPos.y);
  if (dx > TOUCH_THRESHOLD || dy > TOUCH_THRESHOLD) {
    // It's a scroll, cancel any paint intent
    touchStartPos = null;
    isPainting = false;
  }
}

let saveTimeout=null;
function debounceSave(){if(saveTimeout)clearTimeout(saveTimeout);const t=getEditTarget();saveTimeout=setTimeout(()=>{if(t&&allData[t])saveSchedule(t,allData[t]);},500);}
document.addEventListener('mouseup',()=>{if(isPainting){isPainting=false;dragPaintVal=null;lastPaintedKey=null;debounceSave();}});
function handleTouchMove(e){if(!isPainting)return;e.preventDefault();const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY);if(el&&el.classList.contains('cell')&&el.dataset.key){const i=el.dataset.key.lastIndexOf('|');continuePaint(el.dataset.key.substring(0,i),el.dataset.key.substring(i+1));}}

// ===== EDIT GRID =====
function renderEditGrid(name,editable){
  const data=allData[name]||{};
  let html='<table><thead><tr><th class="time-col">Time</th>';
  for(const day of DAYS) html+=`<th>${day}</th>`;
  html+='</tr></thead><tbody>';
  for(const time of TIMES){
    const lunch=isLunchTime(time);
    html+=`<tr><td class="time-col${lunch?' lunch-hour':''}">${time}</td>`;
    for(const day of DAYS){
      const key=`${day}|${time}`,val=data[key]||'';
      html+=`<td class="cell${lunch?' lunch-hour':''}" data-key="${key}" data-val="${val}"${editable?` onmousedown="startPaint('${esc(day)}','${time}',event)" onmouseenter="continuePaint('${esc(day)}','${time}')" ontouchstart="handleTouchStart(event,'${esc(day)}','${time}')" ontouchend="handleTouchEnd(event,'${esc(day)}','${time}')" ontouchmove="handleTouchMove(event)"`:''} >${STATUS_SHORT[val]||''}</td>`;
    }
    html+='</tr>';
  }
  html+='</tbody></table>';
  document.getElementById('grid-container').innerHTML=html;
}

// ===== MATCH TIERS =====
// Tier 1 (green):  2+ Available
// Tier 2 (tan):    1 Available + 1+ Maybe
// Tier 3 (soft blue): 2+ Maybe, 0 Available
// 0 = no highlight (fewer than 2 people total)
function getTier(avail, maybe) {
  if (avail >= 2) return 1;
  if (avail === 1 && maybe >= 1) return 2;
  if (maybe >= 2) return 3;
  return 0;
}

// ===== OVERVIEW EDIT =====
let ovEditMode = false;
let ovDirty = false; // prevents polling from overwriting unsaved changes
const OV_CYCLE = ['A','M','']; // skip Busy in overview

function toggleOvEdit() {
  ovEditMode = !ovEditMode;
  renderOverview();
}

function ovClick(day, time) {
  if (!currentUser || !ovEditMode) return;
  const data = allData[currentUser] || {};
  const key = `${day}|${time}`;
  const cur = data[key] || '';

  // Cycle: A → M → clear (skip Busy)
  const idx = OV_CYCLE.indexOf(cur);
  const newVal = OV_CYCLE[(idx + 1) % OV_CYCLE.length];

  if (newVal) data[key] = newVal;
  else delete data[key];
  allData[currentUser] = data;
  ovDirty = true;

  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    saveSchedule(currentUser, allData[currentUser]).then(() => { ovDirty = false; });
  }, 600);

  // In-place update instead of full re-render
  updateOverviewCell(day, time);
  updateSummaryRow();
}

function updateOverviewCell(day, time) {
  const names = Object.keys(allData).filter(n => n !== '__admins__');
  const key = `${day}|${time}`;
  // Find the cell by data attribute
  const cell = document.querySelector(`td.overview-cell[data-ov-key="${CSS.escape(key)}"]`);
  if (!cell) return;

  let ac = 0, mc = 0, tags = '';
  for (const name of names) {
    const val = (allData[name] || {})[key];
    if (!val || val === 'B') continue;
    if (val === 'A') ac++;
    if (val === 'M') mc++;
    const cls = val === 'A' ? 'avail' : 'maybe';
    const short = name.length > 6 ? name.substring(0, 5) + '…' : name;
    tags += `<span class="ov-tag ${cls}">${short}</span>`;
  }
  const tier = getTier(ac, mc);
  if (tier > 0) cell.setAttribute('data-lvl', tier);
  else cell.removeAttribute('data-lvl');
  cell.querySelector('.ov-tags').innerHTML = tags;
}

function updateSummaryRow() {
  // Rebuild just the summary — find existing summary cells and update
  // Easier to just re-render the summary portion
  const summaryRow = document.getElementById('ov-summary-row');
  if (!summaryRow) return;
  const names = Object.keys(allData).filter(n => n !== '__admins__');

  let html = '<td class="time-col" style="background:var(--surface);"></td>';
  for (const day of DAYS) {
    const td = {};
    for (const time of TIMES) {
      const key = `${day}|${time}`;
      let ac = 0, mc = 0;
      const ap = [], mp = [];
      for (const name of names) {
        const val = (allData[name] || {})[key];
        if (!val || val === 'B') continue;
        if (val === 'A') { ac++; ap.push(name); }
        if (val === 'M') { mc++; mp.push(name); }
      }
      td[time] = { ac, mc, ap, mp };
    }
    const slots = buildDaySummary(td);
    if (!slots.length) { html += '<td class="summary-cell" style="color:var(--text-dim);font-style:italic;">—</td>'; continue; }
    html += '<td class="summary-cell">';
    for (const s of slots) {
      const tc = s.tier === 1 ? 't1' : s.tier === 2 ? 't2' : 't3';
      html += `<span class="best-slot"><span class="tier-dot ${tc}"></span><span class="sr">${s.range}</span><span class="sdur">${s.dur}</span><span class="sp">${s.who}</span>${s.hasHot ? ' <span class="hot-tag">(heat)</span>' : ''}</span>`;
    }
    html += '</td>';
  }
  summaryRow.innerHTML = html;
}

// ===== OVERVIEW =====
function renderOverview(){
  const names=Object.keys(allData).filter(n=>n!=='__admins__');
  const canClick = !!currentUser && ovEditMode;

  // Toggle button in header
  const hc = document.getElementById('header-controls');
  if (hc) {
    hc.innerHTML = currentUser
      ? `<span class="ov-edit-toggle ${ovEditMode?'active':''}" onclick="toggleOvEdit()" title="Toggle to click cells and set your availability directly on the overview">↖ ${ovEditMode?'Editing':'Edit'}<span class="info-icon" title="Click cells to set your availability. Cycles: Available → Maybe → Clear" style="margin-left:4px;${ovEditMode?'color:#fff;border-color:rgba(255,255,255,0.5);':''}">i</span></span>`
      : '';
  }

  let html='<table><thead><tr><th class="time-col">Time</th>';
  for(const day of DAYS) html+=`<th>${day}</th>`;
  html+='</tr></thead><tbody>';

  const dayData={};
  for(const day of DAYS) dayData[day]={};

  for(const time of TIMES){
    const lunch=isLunchTime(time);
    html+=`<tr><td class="time-col${lunch?' lunch-hour':''}">${time}</td>`;
    for(const day of DAYS){
      const key=`${day}|${time}`;
      let ac=0,mc=0,tags='';
      const ap=[],mp=[];
      for(const name of names){
        const val=(allData[name]||{})[key];
        if(!val||val==='B')continue;
        if(val==='A'){ac++;ap.push(name);}
        if(val==='M'){mc++;mp.push(name);}
        const cls=val==='A'?'avail':'maybe';
        const short=name.length>6?name.substring(0,5)+'…':name;
        tags+=`<span class="ov-tag ${cls}">${short}</span>`;
      }
      const tier=getTier(ac,mc);
      const lvlAttr=tier>0?` data-lvl="${tier}"`:'';
      const clickAttr=canClick?` onclick="ovClick('${esc(day)}','${time}')"`:'';
      const clickClass=canClick?' clickable':'';
      html+=`<td class="overview-cell${clickClass}${lunch?' lunch-hour':''}" data-ov-key="${key}"${lvlAttr}${clickAttr}><div class="ov-tags">${tags}</div></td>`;
      dayData[day][time]={ac,mc,ap,mp};
    }
    html+='</tr>';
  }

  // Summary rows
  html+=`<tr class="summary-spacer"><td colspan="${DAYS.length+1}"></td></tr>`;
  html+=`<tr class="summary-header"><td class="time-col" style="background:var(--surface2);">Best Times</td>`;
  for(const day of DAYS) html+=`<td style="background:var(--surface2);">${day.split(' ')[0]}</td>`;
  html+='</tr><tr id="ov-summary-row"><td class="time-col" style="background:var(--surface);"></td>';

  for(const day of DAYS){
    const slots=buildDaySummary(dayData[day]);
    if(!slots.length){ html+='<td class="summary-cell" style="color:var(--text-dim);font-style:italic;">—</td>'; continue; }
    html+='<td class="summary-cell">';
    for(const s of slots){
      const tc=s.tier===1?'t1':s.tier===2?'t2':'t3';
      html+=`<span class="best-slot"><span class="tier-dot ${tc}"></span><span class="sr">${s.range}</span><span class="sdur">${s.dur}</span><span class="sp">${s.who}</span>${s.hasHot?' <span class="hot-tag">(heat)</span>':''}</span>`;
    }
    html+='</td>';
  }
  html+='</tr></tbody></table>';
  document.getElementById('grid-container').innerHTML=html;
}

function buildDaySummary(td){
  const chunks=[];let cur=null;
  for(let i=0;i<TIMES.length;i++){
    const t=TIMES[i],d=td[t]||{ac:0,mc:0,ap:[],mp:[]};
    const tier=getTier(d.ac,d.mc);
    if(tier>0){
      if(!cur) cur={si:i,times:[t],tiers:[tier],people:new Set([...d.ap,...d.mp]),totalPeople:[d.ac+d.mc]};
      else { cur.times.push(t);cur.tiers.push(tier);d.ap.forEach(p=>cur.people.add(p));d.mp.forEach(p=>cur.people.add(p));cur.totalPeople.push(d.ac+d.mc); }
    } else {
      if(cur){if(cur.times.length>=2)chunks.push(finChunk(cur));cur=null;}
    }
  }
  if(cur&&cur.times.length>=2)chunks.push(finChunk(cur));

  // Sort: tier asc, then people count desc, then chronological
  chunks.sort((a,b)=>a.tier-b.tier || b.avgPeople-a.avgPeople || a.si-b.si);
  return chunks;
}

function finChunk(c){
  const endIdx=c.si+c.times.length-1;
  const end=endIdx+1<TIMES.length?TIMES[endIdx+1]:'6:00 PM';
  const bestTier=Math.min(...c.tiers);
  const hasHot=c.times.some(t=>isHotTime(t));
  const who=[...c.people].sort().join(', ');
  const hours=c.times.length*0.5;
  const dur=hours===1?'1hr':hours%1===0?hours+'hr':hours+'hr';
  const avgPeople=c.totalPeople.reduce((a,b)=>a+b,0)/c.totalPeople.length;
  return {range:`${c.times[0]}–${end}`,tier:bestTier,hasHot,who,dur,avgPeople,si:c.si};
}

// ===== ADD MEMBER =====
function addMember(){
  const input=document.getElementById('new-member-name'),name=input.value.trim();
  if(!name){input.focus();return;}
  const existing=Object.keys(allData).find(n=>n.toLowerCase()===name.toLowerCase()&&n!=='__admins__');
  if(existing){alert(existing+' already exists');return;}
  allData[name]={};saveSchedule(name,{});buildTabs();switchTab(name);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

initLogin();
