<!DOCTYPE html>
<html lang="en" data-theme="parchment">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Team Scheduler</title>
<style>
/* ====== THEMES ====== */
[data-theme="parchment"] {
  --bg:#f3ede6;--surface:#ffffff;--surface2:#eae4db;--text:#141210;--text-dim:#6e655c;
  --accent:#b5422a;--accent-hover:#963522;--green:#1a5c3a;--green-bg:#b8e0b2;--green-text:#0d3a1e;
  --yellow:#7d6218;--yellow-bg:#f0e0a0;--yellow-text:#4a3a0e;--orange:#a8500e;--orange-bg:#f5d4a8;--orange-text:#6e3408;
  --red:#8e3518;--red-bg:#f0cfc4;--red-text:#5a2210;--border:#d4ccc2;--border-strong:#b5ada4;--lunch-bg:#ddd9d2;
  --t1:#a0d89a;--t1-text:#0d3a1e;--t2:#e0d4b0;--t2-text:#5a4a28;--t3:#b8d4e8;--t3-text:#1e3a50;
  --t1-dot:#2a8a3e;--t2-dot:#a08840;--t3-dot:#3a7aa0;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--radius:8px;
}
[data-theme="ember"] {
  --bg:#1c1a18;--surface:#2a2724;--surface2:#353230;--text:#e8ddd0;--text-dim:#9a8e80;
  --accent:#d48a3a;--accent-hover:#b87228;--green:#6aaa5a;--green-bg:#2a3a22;--green-text:#b0e0a0;
  --yellow:#d0a840;--yellow-bg:#3a3218;--yellow-text:#f0d880;--orange:#d08040;--orange-bg:#3a2818;--orange-text:#f0b878;
  --red:#c05848;--red-bg:#3a2220;--red-text:#f0a898;--border:#44403a;--border-strong:#5a5550;--lunch-bg:#302c28;
  --t1:#2a4a22;--t1-text:#b0e0a0;--t2:#4a3a18;--t2-text:#f0d880;--t3:#2a3040;--t3-text:#a0c0e0;
  --t1-dot:#6aaa5a;--t2-dot:#d0a840;--t3-dot:#6090c0;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--radius:8px;
}
[data-theme="persia"] {
  --bg:#f2e6d0;--surface:#faf3e6;--surface2:#e8d8be;--text:#2e1a0e;--text-dim:#7a5c3e;
  --accent:#1a8a82;--accent-hover:#148078;--green:#1a8a82;--green-bg:#d0f0ea;--green-text:#0e4a44;
  --yellow:#b8860b;--yellow-bg:#f8ecc8;--yellow-text:#5a4008;--orange:#c46a30;--orange-bg:#f5dcc0;--orange-text:#6a3210;
  --red:#b84040;--red-bg:#f0d0c8;--red-text:#6a1e1e;--border:#c8b898;--border-strong:#b0986a;--lunch-bg:#e8d8be;
  --t1:#d0f0ea;--t1-text:#0e4a44;--t2:#f8ecc8;--t2-text:#5a4008;--t3:#d8e8f0;--t3-text:#1a3848;
  --t1-dot:#1a8a82;--t2-dot:#b8860b;--t3-dot:#c46a30;
  --font:'Georgia','Times New Roman',serif;--radius:4px;
}
[data-theme="forest"] {
  --bg:#e8e0cc;--surface:#f2ece0;--surface2:#ddd4c0;--text:#2a2818;--text-dim:#6a6450;
  --accent:#5a7a48;--accent-hover:#4a6838;--green:#3a7a3a;--green-bg:#c0ddb8;--green-text:#1a3a18;
  --yellow:#8a7828;--yellow-bg:#e8dca0;--yellow-text:#4a4010;--orange:#a06828;--orange-bg:#e8c8a0;--orange-text:#5a3810;
  --red:#8a4028;--red-bg:#e0baa8;--red-text:#4a2010;--border:#c8bca0;--border-strong:#a89878;--lunch-bg:#d8d0b8;
  --t1:#c0ddb8;--t1-text:#1a3a18;--t2:#e8dca0;--t2-text:#4a4010;--t3:#b8ccd8;--t3-text:#1a3040;
  --t1-dot:#3a7a3a;--t2-dot:#8a7828;--t3-dot:#4878a0;
  --font:'Georgia','Times New Roman',serif;--radius:10px;
}
[data-theme="retro"] {
  --bg:#c8c8c8;--surface:#e0e0e0;--surface2:#b0b0b0;--text:#0000aa;--text-dim:#4444aa;
  --accent:#aa0000;--accent-hover:#880000;--green:#00aa00;--green-bg:#aaffaa;--green-text:#005500;
  --yellow:#aaaa00;--yellow-bg:#ffffaa;--yellow-text:#555500;--orange:#aa5500;--orange-bg:#ffddaa;--orange-text:#553300;
  --red:#aa0000;--red-bg:#ffaaaa;--red-text:#550000;--border:#888888;--border-strong:#555555;--lunch-bg:#b0b0b0;
  --t1:#aaffaa;--t1-text:#005500;--t2:#ffffaa;--t2-text:#555500;--t3:#aaaaff;--t3-text:#000055;
  --t1-dot:#00aa00;--t2-dot:#aaaa00;--t3-dot:#0000aa;
  --font:'Courier New',Courier,monospace;--radius:0px;
}

* { box-sizing:border-box;margin:0;padding:0; }
body { font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s; }

#login-screen { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px; }
#login-screen h1 { font-size:2em;margin-bottom:8px; }
#login-screen p { color:var(--text-dim);margin-bottom:24px; }
#login-screen input { padding:12px 16px;font-size:1.1em;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);width:280px;margin-bottom:12px;outline:none;font-family:var(--font); }
#login-screen input:focus { border-color:var(--accent); }
.join-btn { padding:12px 32px;font-size:1.1em;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-family:var(--font); }
.join-btn:hover { background:var(--accent-hover); }
.existing-users { margin-top:24px;text-align:center; }
.existing-users p { font-size:0.9em;margin-bottom:8px;color:var(--text-dim); }
.user-chip { display:inline-block;padding:6px 14px;margin:4px;border-radius:20px;background:var(--surface);cursor:pointer;font-size:0.9em;border:1px solid var(--border);color:var(--text);font-family:var(--font); }
.user-chip:hover { border-color:var(--accent);background:var(--surface2); }

#app-screen { display:none; }
header { display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:4px 8px; }
header h2 { font-size:1.1em;white-space:nowrap; }
#header-controls { display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:1;min-width:0;justify-content:flex-start;padding:0 8px; }
#header-controls .paint-btn { padding:4px 10px;font-size:0.78em; }
#header-controls .paint-label { font-size:0.75em;margin-right:2px;color:var(--text-dim); }
#header-controls .info-icon { display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--border);font-size:0.6em;color:var(--text-dim);cursor:help;margin-left:-2px;font-style:italic;font-family:Georgia,serif; }
#header-controls .ro-label { font-size:0.78em;color:var(--text-dim);font-style:italic; }
.status-dot { display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px; }
.status-dot.live { background:var(--green); }
.status-dot.offline { background:var(--red); }
.header-right { display:flex;align-items:center;gap:8px;font-size:0.85em;flex-wrap:wrap; }
.btn-small { padding:4px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-dim);cursor:pointer;font-size:0.85em;font-family:var(--font); }
.btn-small:hover { border-color:var(--accent);color:var(--accent); }
.btn-small.admin-active { border-color:var(--orange);color:var(--orange); }
.theme-btn { padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-dim);cursor:pointer;font-size:1em;line-height:1;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center; }
.theme-btn:hover { border-color:var(--accent); }

.admin-bar { padding:6px 16px;background:rgba(168,80,14,0.06);border-bottom:1px solid rgba(168,80,14,0.15);font-size:0.82em;color:var(--orange);display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
.admin-bar .del-btn { padding:3px 10px;border:1px solid rgba(168,80,14,0.3);border-radius:var(--radius);background:transparent;color:var(--orange);cursor:pointer;font-size:0.85em;font-family:var(--font); }
.admin-bar .del-btn:hover { background:rgba(168,80,14,0.1); }

.tabs { display:flex;gap:0;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch; }
.tabs::-webkit-scrollbar { display:none; }
.tab { padding:10px 16px;cursor:pointer;font-size:0.9em;white-space:nowrap;border-bottom:2px solid transparent;color:var(--text-dim);background:none;border-top:none;border-left:none;border-right:none;font-family:var(--font); }
.tab:hover { color:var(--text); }
.tab.active { color:var(--accent);border-bottom-color:var(--accent);font-weight:600; }
.tab.you-tab { color:var(--green);font-weight:700;background:rgba(26,92,58,0.06);border-bottom-color:var(--green); }
.tab.you-tab.active { color:var(--green);border-bottom-color:var(--green); }
.tab.delete-tab { color:var(--red); }

.paint-btn { padding:6px 14px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:0.85em;font-weight:600;background:var(--surface2);color:var(--text-dim);font-family:var(--font);transition:all 0.1s; }
.paint-btn.active { border-color:var(--text); }
.paint-btn[data-status="A"] { background:var(--green-bg);color:var(--green-text); }
.paint-btn[data-status="A"].active { border-color:var(--green); }
.paint-btn[data-status="M"] { background:var(--yellow-bg);color:var(--yellow-text); }
.paint-btn[data-status="M"].active { border-color:var(--yellow); }
.paint-btn[data-status="B"] { background:var(--red-bg);color:var(--red-text); }
.paint-btn[data-status="B"].active { border-color:var(--red); }
.paint-btn[data-status="clear"] { background:var(--surface);color:var(--text-dim); }
.paint-btn[data-status="clear"].active { border-color:var(--text-dim); }
.paint-btn[data-status="cycle"] { background:var(--surface2);color:var(--text); }
.paint-btn[data-status="cycle"].active { border-color:var(--accent);color:var(--accent); }

.grid-container { overflow:auto;padding:0;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 140px);max-height:calc(100dvh - 140px);border-top:1px solid var(--border); }
table { border-collapse:separate;border-spacing:0;width:100%;min-width:700px;user-select:none;-webkit-user-select:none; }
th,td { border:1px solid var(--border);text-align:center;font-size:0.8em; }
th { background:var(--surface2);padding:8px 4px;position:sticky;top:0;z-index:10;font-weight:600;color:var(--text);border-top:none; }
th.time-col { position:sticky;left:0;top:0;z-index:20;background:var(--surface2); }
.time-col { position:sticky;left:0;z-index:5;background:var(--surface);padding:4px 8px;white-space:nowrap;font-weight:500;min-width:70px;color:var(--text-dim);border-left:none; }
.time-col.lunch-hour { background:var(--lunch-bg); }
td.cell { padding:6px 2px;cursor:pointer;min-width:72px;height:32px;transition:background 0.1s;background:var(--surface); }
td.cell:hover { filter:brightness(0.96); }
td.cell[data-val="A"] { background:var(--green-bg);color:var(--green-text);font-weight:600; }
td.cell[data-val="M"] { background:var(--yellow-bg);color:var(--yellow-text);font-weight:600; }
td.cell[data-val="B"] { background:var(--red-bg);color:var(--red-text);font-weight:600; }
td.cell.lunch-hour { border-top:1.5px solid var(--border-strong);border-bottom:1.5px solid var(--border-strong); }
td.cell.lunch-hour:not([data-val="A"]):not([data-val="M"]):not([data-val="B"]) { background:var(--lunch-bg); }

td.overview-cell { padding:3px 2px;min-width:90px;vertical-align:top;background:var(--surface); }
td.overview-cell.clickable { cursor:pointer; }
td.overview-cell.clickable:hover { filter:brightness(0.94); }
.ov-edit-toggle { display:inline-flex;align-items:center;gap:4px;padding:3px 10px;margin-left:8px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-size:0.7em;font-weight:600;color:var(--text-dim);background:var(--surface2);vertical-align:middle;transition:all 0.15s; }
.ov-edit-toggle:hover { border-color:var(--green);color:var(--green); }
.ov-edit-toggle.active { border-color:var(--green);color:#fff;background:var(--green); }
td.overview-cell.lunch-hour { border-top:1.5px solid var(--border-strong);border-bottom:1.5px solid var(--border-strong); }
td.overview-cell.lunch-hour:not([data-lvl]) { background:var(--lunch-bg); }
.ov-tags { display:flex;flex-wrap:wrap;gap:2px;justify-content:center; }
.ov-tag { font-size:0.72em;padding:1px 6px;border-radius:3px;white-space:nowrap;font-weight:600; }
.ov-tag.avail { background:var(--green-bg);color:var(--green-text); }
.ov-tag.maybe { background:var(--yellow-bg);color:var(--yellow-text); }
td.overview-cell[data-lvl="1"] { background:var(--t1); }
td.overview-cell[data-lvl="2"] { background:var(--t2); }
td.overview-cell[data-lvl="3"] { background:var(--t3); }

tr.summary-spacer td { height:20px;border:none;background:transparent; }
tr.summary-header td { background:var(--surface2);font-weight:700;font-size:0.75em;color:var(--text-dim);padding:5px 4px;border-color:var(--border-strong);text-transform:uppercase;letter-spacing:0.04em; }
td.summary-cell { background:var(--surface);padding:6px 5px;vertical-align:top;font-size:0.72em;line-height:1.4;border-color:var(--border);text-align:left; }
.best-slot { display:block;padding:3px 0;margin-bottom:4px; }
.best-slot .slot-top { display:flex;align-items:center;gap:3px; }
.best-slot .tier-dot { width:7px;height:7px;border-radius:50%;flex-shrink:0; }
.best-slot .tier-dot.t1 { background:var(--t1-dot); }
.best-slot .tier-dot.t2 { background:var(--t2-dot); }
.best-slot .tier-dot.t3 { background:var(--t3-dot); }
.best-slot .sr { font-weight:700;color:var(--text); }
.best-slot .sdur { font-weight:500;color:var(--text-dim);font-size:0.9em; }
.best-slot .hot-tag { color:var(--orange);font-style:italic;font-size:0.88em; }
.best-slot .sp { display:block;color:var(--text-dim);font-size:0.9em;padding-left:10px; }

.modal-bg { position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:500; }
.modal { background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius)*1.5);padding:24px;max-width:400px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.12); }
.modal h3 { margin-bottom:12px; }
.modal input,.modal select { width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:1em;margin-bottom:12px;outline:none;font-family:var(--font); }
.modal input:focus,.modal select:focus { border-color:var(--accent); }
.modal-btns { display:flex;gap:8px;justify-content:flex-end; }
.modal-btns button { padding:8px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text);cursor:pointer;font-family:var(--font); }
.modal-btns button.primary { background:var(--accent);color:#fff;border-color:var(--accent); }
.modal-btns button:hover { opacity:0.9; }
.modal .error-msg { color:var(--red);font-size:0.85em;margin-bottom:8px; }
.modal .info-msg { color:var(--text-dim);font-size:0.82em;margin-bottom:10px;line-height:1.4; }
.modal .del-list button { display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:4px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;font-family:var(--font); }
.modal .del-list button:hover { border-color:var(--red);color:var(--red); }

.add-panel { padding:24px;text-align:center; }
.add-panel input { padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:1em;width:220px;margin-right:8px;outline:none;font-family:var(--font); }
.add-panel input:focus { border-color:var(--accent); }
.add-panel button { padding:10px 20px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-family:var(--font); }

.feedback-panel { padding:20px;max-width:640px;margin:0 auto; }
.feedback-panel h3 { font-size:1.1em;margin-bottom:4px; }
.feedback-panel .fb-sub { color:var(--text-dim);font-size:0.82em;margin-bottom:16px; }
.fb-input-row { display:flex;gap:8px;margin-bottom:20px; }
.fb-input-row textarea { flex:1;padding:10px 12px;border:2px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:var(--font);font-size:0.9em;resize:vertical;min-height:44px;max-height:120px;outline:none; }
.fb-input-row textarea:focus { border-color:var(--accent); }
.fb-input-row button { padding:10px 18px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-family:var(--font);white-space:nowrap;align-self:flex-end; }
.fb-list { display:flex;flex-direction:column;gap:10px; }
.fb-card { background:var(--surface);border:1px solid var(--border);border-radius:calc(var(--radius)*1.2);padding:12px 14px; }
.fb-card .fb-meta { display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:0.78em; }
.fb-card .fb-author { font-weight:700;color:var(--text); }
.fb-card .fb-time { color:var(--text-dim); }
.fb-card .fb-done-badge { background:var(--green-bg);color:var(--green-text);padding:1px 6px;border-radius:4px;font-size:0.72em;font-weight:600; }
.fb-card .fb-body { font-size:0.9em;line-height:1.5;color:var(--text);margin-bottom:8px;white-space:pre-wrap; }
.fb-card .fb-actions { display:flex;gap:6px;align-items:center;flex-wrap:wrap; }
.fb-vote-btn { display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2);color:var(--text-dim);cursor:pointer;font-size:0.78em;font-family:var(--font); }
.fb-vote-btn:hover { border-color:var(--accent);color:var(--accent); }
.fb-vote-btn.voted { border-color:var(--green);color:var(--green); }
.fb-admin-btn,.fb-self-btn { padding:2px 8px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text-dim);cursor:pointer;font-size:0.72em;font-family:var(--font); }
.fb-admin-btn:hover,.fb-self-btn:hover { border-color:var(--orange);color:var(--orange); }
.fb-empty { color:var(--text-dim);font-style:italic;font-size:0.9em;text-align:center;padding:30px 0; }
.fb-reply-toggle { font-size:0.75em;color:var(--text-dim);cursor:pointer;padding:2px 0; }
.fb-reply-toggle:hover { color:var(--accent); }
.fb-replies { padding-left:16px;border-left:2px solid var(--border);margin-top:8px; }
.fb-reply { padding:6px 0;border-bottom:1px solid var(--border); }
.fb-reply:last-child { border-bottom:none; }
.fb-reply .fb-meta { margin-bottom:2px; }
.fb-reply .fb-body { margin-bottom:4px;font-size:0.85em; }
.fb-reply-input { display:flex;gap:6px;margin-top:6px; }
.fb-reply-input input { flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:0.82em;outline:none;font-family:var(--font); }
.fb-reply-input button { padding:6px 12px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;cursor:pointer;font-size:0.78em;font-family:var(--font); }

@media(max-width:600px){
  header{flex-wrap:wrap;padding:8px 10px}header h2{font-size:0.9em}.header-right{gap:4px;font-size:0.78em}.header-right .btn-small{padding:3px 8px;font-size:0.78em}
  #header-controls{order:10;flex-basis:100%;padding:6px 0 2px;justify-content:flex-start;gap:3px;border-top:1px solid var(--border);margin-top:4px}#header-controls:empty{display:none}
  #header-controls .paint-btn{padding:4px 8px;font-size:0.72em}#header-controls .paint-label{font-size:0.7em}.ov-edit-toggle{font-size:0.68em;padding:3px 8px}
  th,td{font-size:0.7em}td.cell{min-width:56px;height:34px}.grid-container{max-height:calc(100vh - 160px);max-height:calc(100dvh - 160px)}.tabs{padding:0 4px}.tab{padding:8px 10px;font-size:0.82em}
  .theme-btn{width:26px;height:26px;font-size:0.9em}.fb-input-row{flex-direction:column}.fb-input-row button{align-self:flex-end}
}
</style>
</head>
<body>
<div id="login-screen">
  <h1>Team Scheduler</h1>
  <p>Pick your name or type a new one</p>
  <input type="text" id="name-input" placeholder="Your name..." autocomplete="off" onkeydown="if(event.key==='Enter')joinAs()">
  <button class="join-btn" onclick="joinAs()">Join</button>
  <div class="existing-users" id="existing-users"></div>

async function showFeedback(){await loadFB();at='__fb__';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('header-controls').innerHTML='';const os=document.getElementById('ov-toggle-spot');if(os)os.innerHTML='';rFB();}
let er={};
function rFB(){const g=document.getElementById('grid-container');const sorted=[...fd].sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;const av=Object.keys(a.votes||{}).length,bv=Object.keys(b.votes||{}).length;if(bv!==av)return bv-av;return(b.time||0)-(a.time||0);});
let h=`<div class="feedback-panel"><h3>Feature Requests & Feedback</h3><p class="fb-sub">Suggest improvements, report bugs, or request features.</p><div class="fb-input-row"><textarea id="fbt" placeholder="What would make this better?" rows="2"></textarea><button onclick="subFB()">Submit</button></div><div class="fb-list">`;
if(!sorted.length)h+='<div class="fb-empty">No feedback yet.</div>';
else for(const item of sorted){const votes=Object.keys(item.votes||{}).length;const voted=U&&(item.votes||{})[U];const ago=tA(item.time);const dn=item.done?'<span class="fb-done-badge">Done</span>':'';const reps=item.replies||[];const exp=er[item.id];const isMine=item.author===U;
h+=`<div class="fb-card" style="${item.done?'opacity:0.55':''}"><div class="fb-meta"><span class="fb-author">${esc(item.author)}</span><span class="fb-time">${ago}</span>${dn}</div><div class="fb-body">${esc(item.text)}</div><div class="fb-actions"><button class="fb-vote-btn ${voted?'voted':''}" onclick="vFB('${item.id}')">${voted?'▲':'△'} ${votes}</button>`;
if(reps.length>0)h+=`<span class="fb-reply-toggle" onclick="tR('${item.id}')">${exp?'▾':'▸'} ${reps.length} repl${reps.length===1?'y':'ies'}</span>`;
else h+=`<span class="fb-reply-toggle" onclick="tR('${item.id}')">▸ Reply</span>`;
if(isMine)h+=`<button class="fb-self-btn" onclick="delFB('${item.id}')">Delete</button>`;
if(ia){if(!item.done)h+=`<button class="fb-admin-btn" onclick="mFBD('${item.id}')">Close</button>`;
else h+=`<button class="fb-admin-btn" onclick="mFBD('${item.id}')">Reopen</button>`;
h+=`<button class="fb-admin-btn" onclick="delFB('${item.id}')">Delete</button>`;}
h+=`</div>`;
if(exp){h+=`<div class="fb-replies">`;for(const r of reps){const rMine=r.author===U;h+=`<div class="fb-reply"><div class="fb-meta"><span class="fb-author">${esc(r.author)}</span><span class="fb-time">${tA(r.time)}</span>${rMine?`<button class="fb-self-btn" onclick="delRep('${item.id}','${r.id}')">Delete</button>`:''}</div><div class="fb-body">${esc(r.text)}</div></div>`;}h+=`<div class="fb-reply-input"><input type="text" id="ri-${item.id}" placeholder="Write a reply..." onkeydown="if(event.key==='Enter')subRep('${item.id}')"><button onclick="subRep('${item.id}')">Reply</button></div></div>`;}
h+=`</div>`;}
h+='</div></div>';g.innerHTML=h;}
function tR(id){er[id]=!er[id];rFB();}
function subFB(){if(!U)return;const el=document.getElementById('fbt'),t=(el?el.value:'').trim();if(!t){if(el)el.focus();return;}fd.push({id:'f'+Date.now(),author:U,text:t,time:Date.now(),votes:{},done:false,replies:[]});saveFB();rFB();}
function subRep(id){if(!U)return;const el=document.getElementById('ri-'+id),t=(el?el.value:'').trim();if(!t){if(el)el.focus();return;}const item=fd.find(f=>f.id===id);if(!item)return;if(!item.replies)item.replies=[];item.replies.push({id:'r'+Date.now(),author:U,text:t,time:Date.now()});saveFB();rFB();}
function vFB(id){if(!U)return;const item=fd.find(f=>f.id===id);if(!item)return;if(!item.votes)item.votes={};if(item.votes[U])delete item.votes[U];else item.votes[U]=true;saveFB();rFB();}
function mFBD(id){if(!ia)return;const item=fd.find(f=>f.id===id);if(!item)return;item.done=!item.done;saveFB();rFB();}
function delFB(id){if(!confirm('Delete this?'))return;const item=fd.find(f=>f.id===id);if(!item)return;if(item.author!==U&&!ia)return;fd=fd.filter(f=>f.id!==id);saveFB();rFB();}
function delRep(fid,rid){if(!confirm('Delete reply?'))return;const item=fd.find(f=>f.id===fid);if(!item||!item.replies)return;const rep=item.replies.find(r=>r.id===rid);if(!rep)return;if(rep.author!==U&&!ia)return;item.replies=item.replies.filter(r=>r.id!==rid);saveFB();rFB();}
function tA(ts){if(!ts)return'';const d=Date.now()-ts,m=Math.floor(d/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';const dy=Math.floor(h/24);if(dy<7)return dy+'d ago';const dt=new Date(ts);return`${MONTH_NAMES[dt.getMonth()]} ${dt.getDate()}`;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
initLogin();
</script>
</body>
